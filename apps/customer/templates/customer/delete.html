<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Customer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white rounded-xl shadow-xl overflow-hidden">

        <!-- Header -->
        <div class="bg-red-600 text-white text-center py-5">
            <h2 class="text-2xl font-bold">🗑 Delete Customer</h2>
        </div>

        <!-- Content -->
        <div class="p-6">

            <p class="text-gray-700 text-lg text-center mb-6">
                Are you sure you want to delete
                <span class="font-bold text-red-600">
                    "{{ object.full_name }}"
                </span>?
            </p>

            <form method="POST" class="flex justify-center gap-4">
                {% csrf_token %}

                <button type="submit"
                    class="bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-2 rounded-lg shadow transition duration-300">
                    Yes, Delete
                </button>

                <a href="{% url 'customer_list' %}"
                    class="bg-gray-500 hover:bg-gray-600 text-white font-semibold px-6 py-2 rounded-lg shadow transition duration-300">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</body>

</html>
